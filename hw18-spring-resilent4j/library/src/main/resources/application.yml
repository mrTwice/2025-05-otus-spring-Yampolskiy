server:
  address: 127.0.0.1
  port: 8080
#  servlet:
#    context-path: /


spring:
  datasource:
    url: jdbc:h2:mem:maindb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 5

  sql:
    init:
      mode: never


  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
        format_sql: true
        default_batch_fetch_size: 16

moderation:
  base-url: http://127.0.0.1:9090
  timeouts:
    connect: 300ms
    read: 500ms

resilience4j:
  circuitbreaker:
    instances:
      moderation:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: 900ms
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 5
        recordExceptions:
          - ru.otus.java.springframework.yampolskiy.integretion.exception.ModerationUnavailableException
          - org.springframework.web.client.ResourceAccessException
          - io.github.resilience4j.bulkhead.BulkheadFullException

  retry:
    instances:
      moderation:
        maxAttempts: 2
        waitDuration: 100ms
        retryExceptions:
          - ru.otus.java.springframework.yampolskiy.integretion.exception.ModerationUnavailableException
        ignoreExceptions:
          - ru.otus.java.springframework.yampolskiy.integretion.exception.ModerationClientException
  bulkhead:
    instances:
      moderation:
        maxConcurrentCalls: 10
        maxWaitDuration: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents,retries,bulkheads
  endpoint:
    health:
      show-details: always


logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
